name: Something is wrong
description: A crash, a screen that looks broken, something that doesn't do what it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Dotilda. Please never paste anything from your journal here unless you want it public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dotilda version
      description: Settings, first page (for example 0.6.0).
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: For example Mudita Kompakt, MuditaOS K 1.6.1. Settings › Diagnostics shows it.
    validations:
      required: true
  - type: textarea
    id: crash
    attributes:
      label: Crash report
      description: If Dotilda crashed, Settings › Diagnostics › "Export the crash report" saves a text file. Paste it here.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Photo or screenshot
      description: A photo of the screen helps a lot on e-ink.
