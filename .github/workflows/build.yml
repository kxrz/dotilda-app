name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Release without pushing a tag: Actions → Build → Run workflow, on main, with the version.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as appVersion in app/build.gradle.kts (e.g. 0.3.0). Creates the tag v<version>."
        required: true

# Read-only token by default; only the release job may write (tags and releases).
permissions:
  contents: read

jobs:
  debug:
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: APK size
        run: ls -l app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dotilda-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # A pushed tag, or the tag the manual run creates (the release step creates it on this commit).
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the version matches the code
        run: |
          code="$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts)"
          if [ "v$code" != "${TAG%%-*}" ]; then echo "::error::$TAG does not match appVersion $code"; exit 1; fi
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK and the update manifest
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk dotilda.apk
          cp dotilda.apk "dotilda-${TAG#v}.apk"
          # Release notes come from CHANGELOG.md; no section for this version = no release.
          version="${TAG#v}"; version="${version%%-*}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
          # Read by the app's updater: version, APK of this exact release, checksum, notes.
          jq -n \
            --arg version "${TAG#v}" \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/dotilda.apk" \
            --arg sha "$(sha256sum dotilda.apk | cut -d' ' -f1)" \
            --rawfile notes release-notes.md \
            '{latestVersion: $version, apkUrl: $apk, sha256: $sha, notes: $notes}' > manifest.json
      # Also kept on the run, in case the release step fails and files must be attached by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: |
            dotilda.apk
            dotilda-*.apk
            manifest.json
            release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dotilda.apk
            dotilda-*.apk
            manifest.json
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          # A tag like v1.0.0-rc1 is a test build, not a version to distribute.
          prerelease: ${{ contains(env.TAG, '-') }}
