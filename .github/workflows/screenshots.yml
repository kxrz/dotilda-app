name: Screenshots

# Renders every screen at the Kompakt's size (Robolectric + Roborazzi, see
# app/src/test/java/com/dotilda/app/screens/ScreensTest.kt) and pushes the PNGs to the
# branch screenshots/<branch>, for design reviews.
on:
  push:
    branches-ignore: ["screenshots/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The Gradle output is kept too (gradle.log on the screenshots branch): CI logs are not always reachable.
      - run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --tests "com.dotilda.app.screens.*" -Proborazzi.test.record=true 2>&1 | tee gradle.log
      # Pushed even when a test fails: the images made so far and the test reports show what broke.
      - name: Push to screenshots/<branch>
        if: always()
        run: |
          branch="screenshots/${GITHUB_REF_NAME}"
          mkdir -p app/screenshots/reports
          cp app/build/test-results/testDebugUnitTest/*.xml app/screenshots/reports/ 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong" -A3 gradle.log > app/screenshots/reports/gradle-errors.txt || true
          grep -E "STARTED|PASSED|FAILED|\[screens " gradle.log > app/screenshots/reports/steps.txt || true
          # Room's schema, generated by the build: committed to app/schemas so migrations can be written.
          cp -r app/schemas app/screenshots/reports/ 2>/dev/null || true
          cd app/screenshots
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Screenshots of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$branch"
